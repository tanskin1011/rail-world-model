name: CPU contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate CPU contracts without GPU or private assets
        run: python -m unittest discover -s tests -v
      - name: Prepare public inference inputs without a model
        run: python scripts/prepare_demo.py --profile decel --output local/ci_demo
      - name: Check public file sizes, paths and documentation links
        run: python scripts/audit_release.py
